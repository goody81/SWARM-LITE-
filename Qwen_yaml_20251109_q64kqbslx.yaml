# docker-compose.yml
version: '3.8'

services:
  sworms-lite:
    build: .
    container_name: sworms-lite-main
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app/src
      - LOG_LEVEL=INFO
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.path.append('/app/src'); from sworms_lite import SWORMSLiteCoordinator; print('Health check passed')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  sworms-lite-monitor:
    build: .
    container_name: sworms-lite-monitor
    depends_on:
      - sworms-lite
    command: ["python", "-c", "import asyncio; import time; time.sleep(300)"]  # Keep container running
    restart: unless-stopped