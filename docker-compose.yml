version: '3.8'

services:
  swarm-lite:
    build: .
    image: swarm-lite
    container_name: swarm-lite-main
    environment:
      - SWARM_LITE_LOG_LEVEL=INFO
      - SWARM_LITE_MAX_AGENTS=10
      - SWARM_LITE_MAX_TASK_QUEUE_SIZE=1000
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
      restart_policy:
        condition: on-failure
        max_attempts: 3
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.socket().connect(('localhost', 8080))"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Scale out more instances as needed
  worker:
    image: swarm-lite
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    depends_on:
      - swarm-lite
